name: Verify GENOME
on:
  push:
    branches: ['main', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p /workspace/game/screenshots || true
      - run: npm run test:e2e -- e2e/compact-clues.spec.ts e2e/layout.spec.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: genome-web
          path: dist/
