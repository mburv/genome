name: Verify GENOME
on:
  push:
    branches: ['main', 'fix/**']
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p /workspace/game/screenshots || true
      - run: npm run test:e2e -- e2e/compact-clues.spec.ts e2e/layout.spec.ts
      - run: npm run test:e2e -- e2e/tidy.spec.ts --grep 'replication clues pair|clue chips size'
      - run: npm run build
      # Stage only this verified change; the owner-facing Pages branch is untouched.
      # The connector fast-forwards gh-pages after inspecting the build and test results.
      - name: Stage verified Pages build
        if: github.ref == 'refs/heads/fix/compact-clues'
        shell: bash
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/genome-site" FETCH_HEAD
          git -C "$RUNNER_TEMP/genome-site" rm -r --ignore-unmatch .
          cp -a dist/. "$RUNNER_TEMP/genome-site/"
          touch "$RUNNER_TEMP/genome-site/.nojekyll"
          git -C "$RUNNER_TEMP/genome-site" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/genome-site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/genome-site" add -A
          git -C "$RUNNER_TEMP/genome-site" commit -m "Deploy ${GITHUB_SHA}: compact clues"
          git -C "$RUNNER_TEMP/genome-site" push origin "HEAD:refs/heads/build/compact-clues-${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: genome-web
          path: dist/
