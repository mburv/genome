name: Build full T2T reference packs
on:
  workflow_dispatch:
  push:
    branches: ['fix/full-human-genome']
    paths: ['scripts/prepare-genome.py', '.github/workflows/genome-data.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prepare-genome.py
      - uses: actions/upload-artifact@v4
        with:
          name: genome-t2t-chromosome-packs
          path: genome-packs/*.genome
          compression-level: 0
          retention-days: 90
