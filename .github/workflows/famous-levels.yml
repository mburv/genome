name: Generate Famous Genes levels
on:
  push:
    branches: ['expansion-levels']
    paths: ['scripts/generate-famous.ts', '.github/workflows/famous-levels.yml']
permissions:
  contents: write
jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/generate-famous.ts
      - name: Pin generated boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/campaign/famous.generated.json
          git commit -m "Pin verified Famous Genes puzzle pack"
          git push origin HEAD:expansion-levels
