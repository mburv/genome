name: Extract Famous Genes from T2T
on:
  workflow_dispatch:
  push:
    branches: ['fix/full-human-genome']
    paths: ['scripts/extract-famous-t2t.py','.github/workflows/famous-t2t.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install biopython==1.86
      - name: Download the published reference packs
        env:
          GH_${{ github.token }}: TOKEN
        run: gh release download t2t-chm13-v2.0 --pattern '*.genome' --dir genome-packs
      - run: python3 scripts/extract-famous-t2t.py
      - name: Commit the small verified CDS coordinate index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/genomics/famous-t2t.generated.json
          git commit -m 'Extract Famous Genes CDS from the published T2T reference' || exit 0
          git push origin HEAD:fix/full-human-genome
      - uses: actions/upload-artifact@v4
        with:
          name: famous-t2t-index
          path: src/genomics/famous-t2t.generated.json
